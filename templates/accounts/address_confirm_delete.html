{% extends 'core/base.html' %}
{% block title %}Remove address | ShopHub{% endblock %}
{% block content %}{% include 'core/store_header.html' %}<main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5"><section class="card shadow-sm"><div class="card-body p-4 text-center"><i class="bi bi-geo-alt fs-1 text-success"></i><h1 class="h3 mt-3">Remove this address?</h1><p class="text-secondary">{{ address.full_name }} · {{ address.city }}</p><form method="post" class="d-flex justify-content-center gap-2">{% csrf_token %}<button class="btn btn-danger" type="submit">Remove address</button><a class="btn btn-outline-secondary" href="{% url 'accounts:address_list' %}">Keep this address</a></form></div></section></div></div></main>{% endblock %}
